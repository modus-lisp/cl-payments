name: gates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline-gate-suite:
    runs-on: ubuntu-latest
    # The loopback gate deliberately idles for 14s and pushes 1100 messages
    # through a real socket, so it is slower than a pure vector suite.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # secp256k1-fast and cl-transport are not on Quicklisp; they are
          # vendored under deps/ and pinned by commit.
          submodules: recursive
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl curl
      - name: Install Quicklisp + runtime deps
        run: |
          curl -sL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/ql.lisp
          sbcl --non-interactive --load /tmp/ql.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(ql-util:without-prompting (ql:add-to-init-file))' \
            --eval '(ql:quickload (list :ironclad :usocket :bordeaux-threads))'
      - name: Offline gate suite
        run: inspect/run-all.sh
      - name: Gate logs on failure
        if: failure()
        run: for f in /tmp/lnpay-gate-*.log; do echo "===== $f ====="; tail -80 "$f"; done

  # secp256k1-fast's own suite, including the concurrency check that cl-payments
  # depends on.  Run here as well as upstream: cl-payments derives an ephemeral
  # key per connection, so a regression in CT-MUL-G's thread safety corrupts keys
  # here first and is far cheaper to catch at this pin than in production.
  dependency-thread-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: secp256k1-fast test suite
        run: |
          export CL_SOURCE_REGISTRY="(:source-registry (:tree \"$PWD\") :inherit-configuration)"
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval '(asdf:test-system "secp256k1-fast")'
